<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07080A"><title>Trusted Mining</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* ===== CONFIG: set API_BASE to your deployed backend URL (required) ===== */
window.TM_CONFIG={API_BASE:"",BOT_USERNAME:"TrustedMiningBot"};
</script>
<style>
/* ===== Trusted Mining — Black · Titanium Silver · Orange ===== */
:root{
  --bg:#07080A;--bg2:#0D0F12;--card:#13161A;--card2:#1A1E24;--card3:#232830;
  --line:rgba(201,206,216,.10);--line2:rgba(201,206,216,.19);
  --text:#F4F6F8;--mute:#9BA4B0;--dim:#69727E;
  --orange:#FF7A1A;--orange2:#FF9A45;--orange-soft:rgba(255,122,26,.12);--orange-line:rgba(255,122,26,.38);
  --silver:#C9CED8;--silver2:#E7EAF0;--silver-soft:rgba(201,206,216,.07);
  --ok:#34C98A;--ok-soft:rgba(52,201,138,.12);--warn:#F5A524;--warn-soft:rgba(245,165,36,.12);
  --err:#F0616D;--err-soft:rgba(240,97,109,.12);--info:#5BA8FF;--info-soft:rgba(91,168,255,.12);
  --r-lg:22px;--r:16px;--r-sm:12px;--r-xs:9px;--nav-h:70px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--tg-t:0px;--tg-b:0px;
  --shadow:0 12px 28px -16px rgba(0,0,0,.8);--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Bengali","Hind Siliguri",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{min-height:var(--tg-vh,100vh)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.ic{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:-.2em}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#app{max-width:560px;margin:0 auto;min-height:var(--tg-vh,100vh);position:relative;background:radial-gradient(120% 40% at 50% -6%,rgba(255,122,26,.09),transparent 60%),var(--bg)}
#view{padding:0 16px calc(var(--nav-h) + 38px + var(--safe-b) + var(--tg-b));animation:fade .28s ease}
#view.nonav{padding-bottom:calc(32px + var(--safe-b) + var(--tg-b))}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* top bars */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t) + var(--tg-t)) 0 10px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;background:linear-gradient(180deg,var(--bg) 70%,rgba(7,8,10,0))}
.topbar h1{font-size:1.12rem;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--silver2);position:relative;flex-shrink:0;transition:.15s}
.ibtn:active{transform:scale(.94)}.ibtn .dotb{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--orange);color:#1a0d02;font-size:.62rem;font-weight:800;display:grid;place-items:center;padding:0 4px}
.homebar{display:flex;align-items:center;gap:12px;padding:calc(14px + var(--safe-t) + var(--tg-t)) 0 12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#FF9A45,#E8650A);display:grid;place-items:center;color:#1a0d02;flex-shrink:0;overflow:hidden;box-shadow:0 6px 18px -8px rgba(255,122,26,.7)}
.logo img{width:100%;height:100%;object-fit:cover}.logo svg{width:22px;height:22px}
.brand b{display:block;font-size:1rem;font-weight:800;letter-spacing:.2px}.brand small{display:block;color:var(--mute);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,var(--card3),var(--card2));border:1.5px solid var(--silver);display:grid;place-items:center;font-weight:800;font-size:.9rem;color:var(--silver2);overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}.avatar.lg{width:78px;height:78px;font-size:1.6rem;border-width:2px}

/* cards */
.card{background:linear-gradient(180deg,#171B20,#121519);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:14px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.04);position:relative}
.card.flat{box-shadow:none}.card.tight{padding:12px}
.card-t{display:flex;align-items:center;gap:9px;font-weight:700;font-size:.95rem;margin-bottom:12px}
.card-t .ic{color:var(--orange)}.card-t .more{margin-left:auto;font-size:.76rem;color:var(--orange2);font-weight:700}
.hero{background:linear-gradient(145deg,rgba(255,122,26,.13),rgba(19,22,26,.95) 46%,rgba(201,206,216,.06));border-color:var(--orange-line)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px;font-weight:700;font-size:.98rem}
.sec a,.sec button{font-size:.76rem;color:var(--orange2);font-weight:700}
.muted{color:var(--mute)}.dim{color:var(--dim)}.ok{color:var(--ok)}.err{color:var(--err)}.warn{color:var(--warn)}.or{color:var(--orange)}
.tiny{font-size:.74rem;color:var(--mute)}.bold{font-weight:700}
.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}.gap8{gap:8px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.88rem}.kv:last-child{border:0}.kv span{color:var(--mute)}.kv b{text-align:right;word-break:break-word;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.divider{height:1px;background:var(--line);margin:14px 0}

/* balance */
.cursel{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px 14px;padding:2px}.cursel::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mute);font-weight:700;font-size:.8rem;transition:.15s;white-space:nowrap}
.chip.on{background:var(--orange-soft);border-color:var(--orange-line);color:var(--orange2)}
.big{font-size:2.15rem;font-weight:800;letter-spacing:-.8px;line-height:1.1}.big small{font-size:.95rem;color:var(--silver);font-weight:700;margin-left:4px}
.stat{background:var(--silver-soft);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px}.stat span{display:block;font-size:.68rem;color:var(--mute);font-weight:600;margin-bottom:3px}.stat b{font-size:.98rem;font-weight:700}
.wcard{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
.cur-ic{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,var(--card3),var(--card2));border:1px solid var(--line2);display:grid;place-items:center;font-weight:800;color:var(--orange2);font-size:.9rem;flex-shrink:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;font-weight:700;font-size:.92rem;background:linear-gradient(180deg,#FF8B2E,#EE6A0C);color:#1a0d02;border:1px solid rgba(255,255,255,.14);box-shadow:0 8px 20px -10px rgba(255,122,26,.65),inset 0 1px 0 rgba(255,255,255,.28);transition:.15s;width:100%}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.sec2{background:linear-gradient(180deg,#2A2F37,#1E2228);color:var(--silver2);border-color:var(--line2);box-shadow:none}
.btn.ghost{background:transparent;color:var(--silver2);border:1px solid var(--line2);box-shadow:none}
.btn.danger{background:var(--err-soft);color:var(--err);border:1px solid rgba(240,97,109,.35);box-shadow:none}
.btn.ok{background:linear-gradient(180deg,#3DD596,#25AD72);color:#032418}
.btn.sm{min-height:36px;padding:0 14px;font-size:.8rem;border-radius:11px;width:auto}.btn.inl{width:auto}
.btns{display:flex;gap:10px}.btns .btn{flex:1}

/* quick actions */
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa{background:linear-gradient(180deg,#171B20,#12151A);border:1px solid var(--line);border-radius:var(--r);padding:14px 6px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.76rem;font-weight:700;color:var(--silver2);transition:.15s}
.qa:active{transform:scale(.96);border-color:var(--orange-line)}
.qa .qi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--orange-soft);color:var(--orange);border:1px solid var(--orange-line)}
.qa .qi svg{width:21px;height:21px}.qa.off{opacity:.4}

/* progress */
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}.bar b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--orange2));transition:width .6s}
.bar.ok b{background:linear-gradient(90deg,#25AD72,var(--ok))}
.cd{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:.3px}

/* lists */
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;width:100%;text-align:left;transition:.15s}
button.li:active,a.li:active{border-color:var(--orange-line);transform:scale(.99)}
.li .ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--silver-soft);border:1px solid var(--line);color:var(--silver2);flex-shrink:0}
.li .ico svg{width:19px;height:19px}.li .ico.in{background:var(--ok-soft);color:var(--ok);border-color:rgba(52,201,138,.25)}.li .ico.out{background:var(--err-soft);color:var(--err);border-color:rgba(240,97,109,.25)}.li .ico.or{background:var(--orange-soft);color:var(--orange);border-color:var(--orange-line)}
.li .m{flex:1;min-width:0}.li .m b{display:block;font-size:.9rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .m span{display:block;font-size:.74rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{text-align:right;flex-shrink:0;max-width:44%}.li .r b{display:block;font-weight:800;font-size:.92rem}
.li.unread{border-color:var(--orange-line);background:linear-gradient(90deg,rgba(255,122,26,.08),var(--card) 60%)}
.menu .li{margin-bottom:8px}.li .chev{color:var(--dim);width:16px;height:16px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:.66rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase;border:1px solid;white-space:nowrap}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.pending,.pill.waiting,.pill.warn{color:var(--warn);background:var(--warn-soft);border-color:rgba(245,165,36,.3)}
.pill.completed,.pill.approved,.pill.active,.pill.resolved,.pill.ok,.pill.claimed{color:var(--ok);background:var(--ok-soft);border-color:rgba(52,201,138,.3)}
.pill.processing,.pill.open,.pill.progress,.pill.info{color:var(--info);background:var(--info-soft);border-color:rgba(91,168,255,.3)}
.pill.rejected,.pill.failed,.pill.err,.pill.expired,.pill.suspended{color:var(--err);background:var(--err-soft);border-color:rgba(240,97,109,.3)}
.pill.closed,.pill.mute,.pill.cancelled{color:var(--mute);background:var(--silver-soft);border-color:var(--line2)}
.pill.free{color:var(--silver2);background:var(--silver-soft);border-color:var(--line2)}.pill.paid,.pill.featured{color:var(--orange2);background:var(--orange-soft);border-color:var(--orange-line)}

/* forms */
.fld{margin-bottom:14px}.fld label{display:block;font-size:.76rem;font-weight:700;color:var(--mute);margin-bottom:7px}
.inp,.sel,textarea.inp{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:13px;padding:0 14px;min-height:48px;font-size:.95rem;outline:none;transition:.15s;color:var(--text)}
textarea.inp{padding:12px 14px;min-height:110px;resize:vertical}
.inp:focus,.sel:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
.inp.bad{border-color:var(--err)}.fld .help{font-size:.72rem;color:var(--dim);margin-top:6px}.fld .errm{font-size:.74rem;color:var(--err);margin-top:6px;display:none}.fld.bad .errm{display:block}.fld.bad .inp,.fld.bad .sel{border-color:var(--err)}
.sel{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.sel option{background:#15181c}
.amt{position:relative}.amt .inp{padding-right:78px;font-weight:700;font-size:1.05rem}.amt .max{position:absolute;right:8px;top:8px;height:32px;padding:0 12px;border-radius:9px;background:var(--orange-soft);color:var(--orange2);font-weight:800;font-size:.74rem;border:1px solid var(--orange-line)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-height:38px;padding:0 12px;border-radius:10px;font-weight:700;font-size:.8rem;color:var(--mute);white-space:nowrap}.seg button.on{background:linear-gradient(180deg,#2A2F37,#20252C);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.opt{display:flex;align-items:center;gap:12px;padding:13px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line);margin-bottom:10px;width:100%;text-align:left;transition:.15s}
.opt.on{border-color:var(--orange);background:linear-gradient(90deg,var(--orange-soft),var(--card))}.opt .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);margin-left:auto;flex-shrink:0;display:grid;place-items:center}.opt.on .rd{border-color:var(--orange)}.opt.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--orange)}
.tgl{width:46px;height:26px;border-radius:99px;background:var(--card3);position:relative;flex-shrink:0;transition:.2s;border:1px solid var(--line2)}.tgl::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--silver);transition:.2s}.tgl.on{background:var(--orange);border-color:var(--orange)}.tgl.on::after{left:22px;background:#fff}
.upl{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px dashed var(--line2);border-radius:var(--r);color:var(--mute);font-size:.84rem;width:100%}.upl img{width:46px;height:46px;border-radius:10px;object-fit:cover}

/* nav */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--safe-b) + var(--tg-b));width:min(calc(100% - 24px),536px);z-index:60;display:flex;gap:2px;padding:7px;border-radius:26px;background:rgba(18,21,25,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line2);box-shadow:0 18px 40px -12px rgba(0,0,0,.8)}
#nav[hidden]{display:none}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;border-radius:19px;color:var(--dim);font-size:.64rem;font-weight:700;transition:.2s;min-width:0}
#nav button svg{width:21px;height:21px}#nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nav button.on{color:var(--orange2);background:var(--orange-soft)}

/* overlays */
#overlay{position:fixed;inset:0;z-index:200;display:none}#overlay.show{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.72);animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,560px);max-height:90vh;overflow:auto;background:linear-gradient(180deg,#191D22,#12151A);border:1px solid var(--line2);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + var(--safe-b));animation:up .26s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 14px}
.sheet h3{font-size:1.1rem;margin-bottom:4px;display:flex;align-items:center;gap:10px}.sheet .sub{color:var(--mute);font-size:.84rem;margin-bottom:16px}
.sheet .btns{margin-top:18px}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(calc(100% - 32px),400px);background:linear-gradient(180deg,#191D22,#12151A);border:1px solid var(--line2);border-radius:24px;padding:24px 20px 20px;text-align:center;animation:pop .22s}
@keyframes pop{from{transform:translate(-50%,-46%) scale(.95);opacity:0}to{transform:translate(-50%,-50%);opacity:1}}
.dlg .bigic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;background:var(--orange-soft);color:var(--orange);border:1px solid var(--orange-line)}.dlg .bigic svg{width:30px;height:30px}
.dlg .bigic.ok{background:var(--ok-soft);color:var(--ok);border-color:rgba(52,201,138,.35)}.dlg .bigic.err{background:var(--err-soft);color:var(--err);border-color:rgba(240,97,109,.35)}
.dlg h3{font-size:1.15rem;margin-bottom:6px}.dlg p{color:var(--mute);font-size:.88rem}.dlg .kvs{text-align:left;margin:14px 0 4px}
#toasts{position:fixed;top:calc(12px + var(--safe-t) + var(--tg-t));left:50%;transform:translateX(-50%);z-index:400;width:min(calc(100% - 28px),420px);display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:rgba(26,30,36,.97);border:1px solid var(--line2);border-left:3px solid var(--orange);border-radius:14px;padding:12px 14px;font-size:.86rem;font-weight:600;box-shadow:0 12px 30px -10px rgba(0,0,0,.8);animation:fade .25s;display:flex;gap:10px;align-items:center}
.toast.ok{border-left-color:var(--ok)}.toast.err{border-left-color:var(--err)}.toast.warn{border-left-color:var(--warn)}

/* states */
.sk{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.1),rgba(255,255,255,.04));background-size:200% 100%;animation:shm 1.3s infinite;border-radius:12px}@keyframes shm{to{background-position:-200% 0}}
.sk.card{height:120px;border:0;box-shadow:none}.sk.line{height:14px;margin:8px 0}.sk.li{height:68px;border:0}
.empty{text-align:center;padding:40px 20px;color:var(--mute)}.empty .eic{width:68px;height:68px;border-radius:22px;margin:0 auto 16px;display:grid;place-items:center;background:var(--silver-soft);border:1px solid var(--line2);color:var(--silver)}.empty .eic svg{width:30px;height:30px}.empty b{display:block;color:var(--text);font-size:1rem;margin-bottom:5px}.empty p{font-size:.85rem;margin-bottom:16px}
.empty .btn{width:auto;display:inline-flex}
.fullstate{min-height:var(--tg-vh,100vh);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 26px}
.fullstate .eic{width:88px;height:88px;border-radius:28px;margin-bottom:22px;display:grid;place-items:center;background:var(--orange-soft);border:1px solid var(--orange-line);color:var(--orange)}.fullstate .eic svg{width:40px;height:40px}.fullstate .eic.err{background:var(--err-soft);border-color:rgba(240,97,109,.4);color:var(--err)}
.fullstate h2{font-size:1.3rem;margin-bottom:8px}.fullstate p{color:var(--mute);font-size:.92rem;max-width:340px;margin-bottom:22px}.fullstate .btn{max-width:260px}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--info-soft);border:1px solid rgba(91,168,255,.25);color:#BCDCFF;font-size:.82rem;margin-bottom:14px;line-height:1.45}.note svg{margin-top:2px}
.note.warn{background:var(--warn-soft);border-color:rgba(245,165,36,.3);color:#FFD78A}.note.err{background:var(--err-soft);border-color:rgba(240,97,109,.3);color:#FFB3BA}.note.or{background:var(--orange-soft);border-color:var(--orange-line);color:#FFD2AE}

(function(){'use strict';
const TM=window.TM;
const api=TM.api={token:null,
 async req(method,path,body,opts){opts=opts||{};
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),TM.CFG.TIMEOUT);
  const h={'Content-Type':'application/json','X-Telegram-Init-Data':TM.tg.initData()};
  if(api.token)h.Authorization='Bearer '+api.token;if(opts.idem)h['Idempotency-Key']=opts.idem;
  let res;
  try{res=await fetch(TM.CFG.API_BASE.replace(/\/$/,'')+path,{method,headers:h,body:body&&method!=='GET'?JSON.stringify(body):undefined,signal:ctl.signal,credentials:'omit'})}
  catch(e){clearTimeout(to);const er=new Error(e.name==='AbortError'?'timeout':'network');er.code=e.name==='AbortError'?'timeout':'network';er.status=0;throw er}
  clearTimeout(to);
  let j=null;try{j=await res.json()}catch(e){}
  if(j&&j.serverTime)TM.S.skew=j.serverTime-Date.now();else{const dh=res.headers.get('Date');if(dh)TM.S.skew=new Date(dh).getTime()-Date.now()}
  if(!res.ok||(j&&j.ok===false)){const er=new Error((j&&j.message)||'error');er.status=res.status;er.code=(j&&j.code)||(res.status===401?'unauthorized':res.status===403?'suspended':res.status===503?'maintenance':res.status===429?'rate_limited':'server');throw er}
  return j&&'data' in j?j.data:j},
 get:(p)=>api.req('GET',p),
 post:(p,b,o)=>api.req('POST',p,b||{},o),
 patch:(p,b)=>api.req('PATCH',p,b||{}),
 demo:()=>Promise.resolve(),
 errMsg(e){const k='err.'+(e&&e.code);const m=TM.dict.en[k]?TM.t(k):null;return m||TM.t('err.generic')}
};
})();

 else{const sc=S.cfg.support,ct=sc.contact||{};body='<div class="card"><div class="kv"><span>'+t('sp.hours')+'</span><b>'+esc(sc.hours||'—')+'</b></div>'+(ct.email?'<div class="kv"><span>Email</span><b>'+esc(ct.email)+'</b></div>':'')+'</div>'+inst(L(sc.notice),L(sc.instructions))+'<div class="btns">'+((ct.telegram||app.supportUrl)?'<button class="btn" data-act="link" data-tg="1" data-v="'+esc(ct.telegram||app.supportUrl)+'">'+ic('send')+t('sp.contact')+'</button>':'')+(app.channelUrl?'<button class="btn sec2" data-act="link" data-tg="1" data-v="'+esc(app.channelUrl)+'">'+ic('globe')+t('sp.channel')+'</button>':'')+'</div>'}
 return TM.top(t('support'))+'<div class="seg">'+['tickets','faq','contact'].map(k=>'<button class="'+(spTab===k?'on':'')+'" data-act="spt" data-v="'+k+'">'+t('sp.'+k)+'</button>').join('')+'</div>'+body}};

 chk('subj',(f.subj||'').trim().length<3?t('v.required'):'');chk('msg',(f.msg||'').trim().length<5?t('v.required'):'');if(bad)return;
 ui.busy(el,true);const k='ticket';try{await api.post('/support/tickets',{category:f.cat||S.cfg.support.categories[0],subject:f.subj.trim(),message:f.msg.trim()},{idem:TM.idem(k)});TM.idemClear(k);ui.toast(t('sp.sent'),'ok');spTab='tickets';location.hash='#/support'}
 catch(e){ui.busy(el,false);if(!isNet(e))TM.idemClear(k);ui.alert('err',t('state.error'),api.errMsg(e))}};
pages['ticket']={nav:'',async render(p){const r=await api.get('/support/tickets/'+encodeURIComponent(p[0]));const x=r.ticket;TM.form={};sp.id=x.id;
 return TM.top(x.subject)+'<div class="row between" style="margin-bottom:12px"><span class="tiny">'+esc(catL(x.category))+'</span>'+ui.pill(x.status)+'</div><div id="thread">'+x.messages.map(m=>'<div class="msg '+(m.from==='me'?'me':'')+'">'+esc(m.text)+'<small>'+(m.from==='me'?esc(t('you')):esc(t('support')))+' · '+esc(dt(m.ts))+'</small></div>').join('')+'</div>'+
 (x.status==='closed'?'<div class="note">'+ic('lock')+'<span>'+t('sp.closed')+'</span></div>':'<div class="row" style="margin-top:12px"><input class="inp" maxlength="2000" data-bind="reply" placeholder="'+esc(t('sp.reply'))+'"><button class="ibtn" style="width:48px;height:48px" data-act="spreply" aria-label="'+t('send')+'">'+ic('send')+'</button></div>')}};
ACT.spreply=async(d,el)=>{const m=(TM.form.reply||'').trim();if(!m)return;ui.busy(el,true);try{await api.post('/support/tickets/'+sp.id+'/messages',{message:m});TM.route.refresh(true)}catch(e){ui.busy(el,false);ui.toast(api.errMsg(e),'err')}};

const legalRows=()=>{const lg=S.cfg.legal||{},ic2={terms:'file',privacy:'lock',risk:'alert',about:'info'};return Object.keys(lg).filter(k=>L(lg[k].body)).map(k=>row(ic2[k]||'file',L(lg[k].title)||k,'#/legal/'+k)).join('')};

pages.profile={nav:'profile',root:true,async render(){const me=S.me=await api.get('/me');
 return '<div class="topbar"><h1>'+t('nav.profile')+'</h1></div><div class="card hero" style="text-align:center"><div class="avatar lg" style="margin:0 auto 12px">'+TM.avatar(me)+'</div><b style="font-size:1.1rem">'+esc(me.name)+'</b><div class="tiny">'+(me.username?'@'+esc(me.username)+' · ':'')+'ID '+esc(me.id)+'</div><div style="margin-top:10px">'+ui.pill(me.status)+'</div></div><div class="menu">'+
 row('user',t('account'),'#/account')+row('settings',t('settings'),'#/settings')+(TM.featOn('notifications')?row('bell',t('nav.notifications'),'#/notifications'):'')+(TM.featOn('history')?row('history',t('history'),'#/history'):'')+(TM.featOn('referral')?row('users',t('referral'),'#/referral'):'')+(TM.featOn('leaderboard')?row('trophy',t('leaderboard'),'#/leaderboard'):'')+(TM.featOn('support')?row('help',t('support'),'#/support'):'')+legalRows()+'</div><div class="tiny" style="text-align:center;margin-top:10px">'+esc(S.cfg.app.name)+' v'+TM.CFG.VERSION+'</div>'}};
pages.account={nav:'',async render(){const me=S.me=await api.get('/me');return TM.top(t('account'))+'<div class="card"><div class="kv"><span>'+t('acc.name')+'</span><b>'+esc(me.name)+'</b></div><div class="kv"><span>'+t('acc.username')+'</span><b>'+(me.username?'@'+esc(me.username):'—')+'</b></div><div class="kv"><span>ID</span><b>'+esc(me.id)+'</b></div><div class="kv"><span>Telegram ID</span><b>'+esc(me.tgId)+'</b></div><div class="kv"><span>'+t('acc.joined')+'</span><b>'+esc(TM.d(me.joinedAt))+'</b></div><div class="kv"><span>'+t('acc.status')+'</span><b>'+ui.pill(me.status)+'</b></div></div>'}};
pages.settings={nav:'',async render(){const me=S.me=await api.get('/me');const hp=TM.ls.get('tm_haptic',true);
 return TM.top(t('settings'))+'<div class="card"><div class="card-t">'+ic('globe')+t('language')+'</div>'+langSeg()+'</div>'+
 '<div class="card"><div class="row between" style="padding:6px 0"><div><b>'+t('set.notif')+'</b><div class="tiny">'+t('set.notif_t')+'</div></div><button class="tgl '+(me.notif?'on':'')+'" data-act="tnotif" role="switch" aria-checked="'+!!me.notif+'" aria-label="'+t('set.notif')+'"></button></div><div class="divider"></div><div class="row between" style="padding:6px 0"><div><b>'+t('set.haptic')+'</b><div class="tiny">'+t('set.haptic_t')+'</div></div><button class="tgl '+(hp?'on':'')+'" data-act="thap" role="switch" aria-checked="'+hp+'" aria-label="'+t('set.haptic')+'"></button></div></div>'}};
ACT.lang=async d=>{TM.setLang(d.v);try{await api.patch('/me',{lang:d.v})}catch(e){}TM.renderNav();TM.route.refresh(true)};
ACT.tnotif=async()=>{try{S.me=await api.patch('/me',{notif:!S.me.notif});TM.route.refresh(true)}catch(e){ui.toast(api.errMsg(e),'err')}};
ACT.thap=()=>{TM.ls.set('tm_haptic',!TM.ls.get('tm_haptic',true));TM.route.refresh(true)};
pages.legal={nav:'',async render(p){const lg=S.cfg.legal||{},k=lg[p[0]]?p[0]:Object.keys(lg)[0],d=lg[k]||{};return TM.top(L(d.title)||t('legal.terms'))+'<div class="card" style="white-space:pre-wrap;font-size:.88rem;color:var(--silver)">'+esc(L(d.body)||t('legal.none'))+'</div>'}};

})();

(function(){'use strict';
const TM=window.TM,{t,esc,ic,$}=TM,S=TM.S,ui=TM.ui,ACT=TM.ACT,api=TM.api,pages=TM.pages;
const view=()=>$('#view');
const ROUTES=[[/^\/home$/,'home'],[/^\/mining$/,'mining'],[/^\/plans$/,'plans'],[/^\/wallet$/,'wallet'],[/^\/deposit$/,'deposit'],[/^\/withdraw$/,'withdraw'],[/^\/referral$/,'referral'],[/^\/history$/,'history'],[/^\/leaderboard$/,'leaderboard'],[/^\/notifications$/,'notifications'],[/^\/support$/,'support'],[/^\/support-new$/,'support-new'],[/^\/support\/([\w-]+)$/,'ticket'],[/^\/profile$/,'profile'],[/^\/account$/,'account'],[/^\/settings$/,'settings'],[/^\/legal\/(\w+)$/,'legal']];
const NAV0=[['home','home','nav.home'],['mining','cpu','nav.mining'],['plans','layers','nav.plans'],['wallet','wallet','nav.wallet'],['profile','user','nav.profile']];
const featOn=k=>{const f=((S.cfg||{}).features||{})[k];return !f||(f.enabled!==false&&f.visible!==false)};
const navList=()=>NAV0.filter(x=>{const f=((S.cfg||{}).features||{})[x[0]];return !f||(f.enabled!==false&&f.visible!==false&&f.nav!==false)});
TM.featTitle=(k,def)=>{const f=((S.cfg||{}).features||{})[k],ti=f&&f.title;if(ti){const v=ti[S.lang]||'';if(v&&!(S.lang==='bn'&&ti.bn===ti.en))return v}return def};
TM.featOn=featOn;
let cur={name:'home',params:[]},tok=0,booted=false;
TM.renderNav=()=>{const n=$('#nav');n.innerHTML=navList().map(x=>{const lb=TM.featTitle(x[0],t(x[2]));return '<button data-go="#/'+x[0]+'" data-n="'+x[0]+'" aria-label="'+esc(lb)+'">'+ic(x[1])+'<span>'+esc(lb)+'</span></button>'}).join('');setNav()};
const setNav=()=>{const p=pages[cur.name];const n=$('#nav');n.hidden=!(p&&p.nav);view().classList.toggle('nonav',!(p&&p.nav));n.querySelectorAll('button').forEach(b=>b.classList.toggle('on',p&&b.dataset.n===p.nav))};
const fullState=e=>{const c=e&&e.code;
 if(c==='maintenance'){const a=(S.cfg||{}).app||{},m=TM.L(a.maintenanceMessage);return ui.full('tool',t('state.maint'),(m||t('state.maint_t'))+(a.maintenanceEta?' · '+a.maintenanceEta:''),t('retry'),'retryboot')}
 if(c==='feature_disabled')return ui.full('lock',t('state.featoff'),t('err.feature_disabled'),t('nav.home'),'gohome');
 if(c==='unauthorized'&&!TM.tg.initData())return ui.full('lock',t('state.tgonly'),t('state.tgonly_t'));
 if(c==='suspended')return ui.full('ban',t('state.susp'),t('state.susp_t'),t('support'),'suspsupport','err');
 if(c==='unauthorized')return ui.full('lock',t('state.auth'),t('state.auth_t'),t('retry'),'retryboot','err');return null};
async function render(soft){const my=++tok;let name=cur.name,p=pages[name];
 if(!p){view().innerHTML=ui.full('alert',t('state.404'),t('state.404_t'),t('nav.home'),'gohome');setNav();TM.tg.setBack(null);return}
 setNav();TM.tg.setBack(p.root?null:ACT.back);if(!soft)ui.close();
 const y=window.scrollY;if(!soft){view().innerHTML=TM.top('')&&(p.root?'':'<div class="topbar"><button class="ibtn" data-act="back">'+ic('back')+'</button></div>')+'<div class="sk card"></div>'+ui.skel(3);window.scrollTo(0,0)}
 try{const h=await p.render(cur.params);if(my!==tok)return;view().innerHTML=h;if(p.mount)p.mount();if(soft)window.scrollTo(0,y);
  if(name==='home')quietUnread()}
 catch(e){if(my!==tok)return;console.warn(e);const f=fullState(e);view().innerHTML=f||((p.root?'':'<div class="topbar"><button class="ibtn" data-act="back">'+ic('back')+'</button></div>')+ui.err(e))}}
async function quietUnread(){try{const r=await api.get('/notifications');if(r.unread!==S.unread){S.unread=r.unread;if(cur.name==='home')render(true)}}catch(e){}}
function parse(){const h=(location.hash||'#/home').slice(1)||'/home';for(const r of ROUTES){const m=h.match(r[0]);if(m){cur={name:r[1],params:m.slice(1)};return}}cur={name:'__404',params:[]}}
TM.route={refresh:soft=>render(!!soft)};
window.addEventListener('hashchange',()=>{parse();render(false)});
ACT.retry=()=>render(false);ACT.gohome=()=>{location.hash='#/home'};
ACT.retryboot=()=>location.reload();ACT.suspsupport=()=>{const u=((S.cfg||{}).app||{}).supportUrl;if(u)TM.tg.openTG(u)};
/* countdown ticker (visual only — the server decides if a claim is allowed) */
setInterval(()=>{const now=TM.now();let rl=false;
 TM.$$('.cd[data-t]').forEach(el=>{const r=+el.dataset.t-now;if(r<=0){if(el.textContent!==t('ready'))el.textContent=t('ready');if(el.dataset.rl==='1'){el.dataset.rl='0';rl=true}}else el.textContent=TM.hms(r)});
 TM.$$('.ring[data-t]').forEach(el=>{const s=+el.dataset.s,e=+el.dataset.t;el.style.setProperty('--p',Math.max(0,Math.min(100,(now-s)/(e-s)*100)))});
 if(rl)render(true)},1000);
window.addEventListener('offline',()=>ui.toast(t('state.offline'),'err'));window.addEventListener('online',()=>{ui.toast(t('online'),'ok');render(true)});
function demobar(){const d=$('#demo');if(!TM.DEMO){d.innerHTML='';return}d.innerHTML=''}
TM.demobar=demobar;
async function boot(){
 TM.tg.init();
 const done0=()=>{const s=$('#splash');if(s){s.style.opacity=0;setTimeout(()=>s.remove(),250)}};
 {const sv=TM.ls.get('tm_lang',null);TM.S.lang=sv||((TM.tg.user().language_code||'')==='bn'?'bn':'en');document.documentElement.lang=TM.S.lang}
 if(!TM.CFG.API_BASE){$('#nav').hidden=true;view().innerHTML=ui.full('tool',t('state.cfg'),t('state.cfg_t'));return done0()}
 TM.renderNav();
 const done=()=>{const s=$('#splash');if(s){s.style.opacity=0;setTimeout(()=>s.remove(),250)}};
 try{S.cfg=await api.get('/config');demobar();
  {const lg=S.cfg.languages||{},en=lg.enabled&&lg.enabled.length?lg.enabled:['en','bn'];let l=TM.ls.get('tm_lang',null);if(!l)l=(TM.tg.user().language_code==='bn'&&en.includes('bn'))?'bn':(lg.default||'en');if(!en.includes(l))l=lg.default&&en.includes(lg.default)?lg.default:en[0];TM.S.lang=l;document.documentElement.lang=l;TM.renderNav()}
  if(S.cfg.app.maintenance){view().innerHTML=fullState({code:'maintenance'});$('#nav').hidden=true;return done()}
  const a=await api.post('/auth/telegram',{initData:TM.tg.initData(),user:TM.tg.user()});api.token=a&&a.token||null;
  S.me=await api.get('/me');
  if(S.me.status==='suspended'){view().innerHTML=fullState({code:'suspended'});$('#nav').hidden=true;return done()}
 }catch(e){console.warn(e);const f=fullState(e);view().innerHTML=f||ui.full(e.code==='network'||e.code==='timeout'?'wifioff':'alert',t(e.code==='network'||e.code==='timeout'?'state.offline':'state.error'),e.code==='network'||e.code==='timeout'?t('state.offline_t'):api.errMsg(e),t('retry'),'retryboot');$('#nav').hidden=true;demobar();return done()}
 booted=true;if(!location.hash)location.hash='#/home';parse();await render(false);done()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();


</script></body></html>
