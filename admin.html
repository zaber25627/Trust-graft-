(function(){'use strict';
const A=window.A,{$,esc,ic}=A;
const NAV=[['Overview',[['dashboard','Dashboard','dash']]],
['Users',[['users','Users','users'],['referrals','Referrals','gift'],['tickets','Support tickets','help']]],
['Mining',[['plans','Mining plans','layers'],['mining','Mining management','cpu']]],
['Finance',[['currencies','Currencies','coin'],['wallets','Wallets','wallet'],['ledger','Ledger','list'],['deposits','Deposits','down'],['withdrawals','Withdrawals','up'],['payments','Payment methods','wallet'],['gateways','Gateways','bolt'],['payment-events','Payment events','list'],['transactions','Transactions','list']]],
['Engagement',[['notifications','Notifications','bell'],['send','Send notification','send'],['announcements','Announcements','bell'],['leaderboard','Leaderboard','trophy']]],
['Content',[['branding','Branding','image'],['home-content','Home content','dash'],['faq','FAQ','help'],['legal','Legal & policy','file'],['language','Language','globe']]],
['Settings',[['general','General','set'],['features','Feature control','tool'],['mining-settings','Mining settings','set'],['deposit-settings','Deposit settings','set'],['withdraw-settings','Withdrawal settings','set'],['referral-settings','Referral settings','set'],['support-settings','Support settings','set'],['maintenance','Maintenance','alert']]],
['System',[['reports','Reports','chart'],['audit','Audit logs','file'],['security','Security','shield'],['system','System status','cpu'],['profile','Admin profile','users']]]];
const root=$('#app');
A.showSetup=()=>{root.innerHTML='<div class="fullmsg"><div><div class="brand" style="justify-content:center;border:0">'+logo()+'<div><b>Trusted Mining</b><small>Admin Panel</small></div></div><h2 style="margin:10px 0">Backend not configured</h2><p style="color:var(--mute);line-height:1.6">This panel contains no data of its own. Open <code>admin.html</code> in a text editor and set <code>API_BASE</code> in <code>window.TM_ADMIN_CONFIG</code> to your deployed backend URL (e.g. <code>https://your-backend.onrender.com</code>), then reload. See README.</p></div></div>'};
const logo=()=>'<div class="lg">'+ic('cpu')+'</div>';
A.showLogin=(msg)=>{A.setTok(null);document.body.classList.remove('in');root.innerHTML='<div id="login"><div class="lbox"><div class="brand">'+logo()+'<div style="text-align:left"><b>Trusted Mining</b><small>Admin Panel</small></div></div><div class="card"><h3 style="margin-bottom:12px">Super Admin sign in</h3>'+(msg?'<div class="note w" id="lm">'+ic('alert')+'<span>'+esc(msg)+'</span></div>':'<div id="lm"></div>')+'<form id="lf" autocomplete="on"><div class="fld"><label>Email</label><input class="inp" id="le" type="email" autocomplete="username" required></div><div class="fld"><label>Password</label><div class="row" style="flex-wrap:nowrap"><input class="inp grow" id="lp" type="password" autocomplete="current-password" required><button type="button" class="btn s" id="lt" style="min-width:64px">Show</button></div></div><button class="btn" id="lb" style="width:100%;margin-top:8px">Sign in</button></form><div class="tiny" style="margin-top:12px;text-align:center">Authorised administrator only. All sign-ins are logged.</div></div></div></div>';
 $('#lt').onclick=()=>{const p=$('#lp');p.type=p.type==='password'?'text':'password';$('#lt').textContent=p.type==='password'?'Show':'Hide'};
 $('#lf').onsubmit=async e=>{e.preventDefault();const b=$('#lb');b.disabled=true;b.textContent='Signing in…';try{const r=await A.api('POST','/admin/auth/login',{email:$('#le').value.trim(),password:$('#lp').value});A.setTok(r.token);A.sessionExpired=false;await start()}catch(er){b.disabled=false;b.textContent='Sign in';$('#lm').outerHTML='<div class="note e" id="lm">'+ic('alert')+'<span>'+esc(A.msg(er))+'</span></div>'}}};

 if(!hit){v.innerHTML=A.empty('Page not found','This page does not exist.');$('#ttl').textContent='Not found';return}
 $('#ttl').textContent=hit[0][2]||'';window.scrollTo(0,0);try{await hit[0][1](hit[1],v)}catch(e){console.error(e);v.innerHTML=A.errBox(e)}};

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&!(t.tagName==='INPUT')){const f=A.ACT[t.dataset.a];if(f){e.preventDefault();f(t,e)}return}

 try{await A.api('GET','/admin/auth/me');await A.refreshCur();shell();if(!location.hash||location.hash==='#/')location.hash='#/dashboard';await A.route()}
 catch(e){if(e.code==='network'){root.innerHTML='<div class="fullmsg"><div><h2>Cannot reach backend</h2><p style="color:var(--mute)">'+esc(A.msg(e))+'</p><button class="btn" onclick="location.reload()">Retry</button></div></div>'}else if(!A.sessionExpired)A.showLogin()}};
start();
})();
